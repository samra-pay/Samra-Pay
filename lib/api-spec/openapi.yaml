          $ref: "#/components/schemas/RemittanceQuote"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        failureCode:
          anyOf:
            - type: string
            - type: "null"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TransferTimelineItem"
      required:
        [
          id,
          status,
          recipientDisplay,
          quoteSnapshot,
          createdAt,
          updatedAt,
          failureCode,
          timeline,
        ]

    TransferPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required: [items, nextCursor]

    TransferDemoScenario:
      type: string
      enum:
        [
          happy_path,
          caliza_rejection,
          chapa_failure,
          settlement_refund,
          timeout_retry,
          duplicate_event,
          out_of_order_event,
        ]

    ReconciliationDemoScenario:
      type: string
      enum: [happy_path, reconciliation_amount_mismatch, missing_report_line]

