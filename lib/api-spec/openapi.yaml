openapi: 3.1.0
info:
  # Do not change the title. Generated import paths depend on it.
  title: Api
  version: 0.2.0
  description: Samra Pay synthetic architecture-foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: customer
  - name: accounts
  - name: activity
  - name: beneficiaries
  - name: remittance
  - name: demo
  - name: operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Process liveness
      responses:
        "200":
          description: The API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/me:
    get:
      operationId: getCurrentCustomer
      tags: [customer]
      summary: Get the synthetic demo customer
      responses:
        "200":
          description: Current synthetic customer and runtime mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCustomer"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List ledger-derived customer accounts
      responses:
        "200":
          description: Customer account summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List ledger-derived customer activity
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/beneficiaries:
    get:
      operationId: listBeneficiaries
      tags: [beneficiaries]
      summary: List active beneficiaries owned by the current actor
      responses:
        "200":
          description: Active synthetic beneficiaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Beneficiary"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createBeneficiary
      tags: [beneficiaries]
      summary: Create a synthetic beneficiary for the current actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBeneficiaryRequest"
      responses:
        "201":
          description: Beneficiary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/beneficiaries/{beneficiaryId}:
    parameters:
      - $ref: "#/components/parameters/BeneficiaryId"
    get:
      operationId: getBeneficiary
      tags: [beneficiaries]
      summary: Get an active beneficiary owned by the current actor
      responses:
        "200":
          description: Beneficiary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateBeneficiary
      tags: [beneficiaries]
      summary: Update an active beneficiary owned by the current actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBeneficiaryRequest"
      responses:
        "200":
          description: Beneficiary updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteBeneficiary
      tags: [beneficiaries]
      summary: Soft-delete an active beneficiary owned by the current actor
      responses:
        "204":
          description: Beneficiary soft-deleted
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/options:
    get:
      operationId: getRemittanceOptions
      tags: [remittance]
      summary: List supported synthetic remittance options
      responses:
        "200":
          description: Synthetic funding and delivery options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemittanceOptions"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/quotes:
    post:
      operationId: createRemittanceQuote
      tags: [remittance]
      summary: Create an immutable server-calculated quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemittanceQuote"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers:
    get:
      operationId: listRemittanceTransfers
      tags: [remittance]
      summary: List customer remittance transfers
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Transfer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPage"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createRemittanceTransfer
      tags: [remittance]
      summary: Reserve funds and create a synthetic transfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "410":
          $ref: "#/components/responses/ExpiredProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers/{transferId}:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    get:
      operationId: getRemittanceTransfer
      tags: [remittance]
      summary: Get a transfer and its normalized timeline
      responses:
        "200":
          description: Transfer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers/{transferId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    post:
      operationId: cancelRemittanceTransfer
      tags: [remittance]
      summary: Cancel a transfer before its non-cancellable boundary
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/remittance/transfers/{transferId}/scenario:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    post:
      operationId: selectDemoTransferScenario
      tags: [demo]
      summary: Select and advance a deterministic fake-provider scenario
      description: Available only when the backend is explicitly in demo/fake mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectScenarioRequest"
      responses:
        "200":
          description: Updated transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/reconciliation/runs:
    post:
      operationId: runDemoReconciliation
      tags: [demo]
      summary: Run deterministic fake-provider reconciliation
      description: Available only when the backend is explicitly in demo/fake mode.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunReconciliationRequest"
      responses:
        "201":
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/reconciliation/runs/{runId}:
    get:
      operationId: getDemoReconciliationRun
      tags: [demo]
      summary: Get a deterministic reconciliation result
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/internal/auth/session:
    post:
      operationId: createWorkforceSession
      tags: [operations-auth]
      summary: Create an opaque workforce session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceLoginRequest"
      responses:
        "201":
          description: Authenticated workforce identity; session token is returned only as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceSession"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
    get:
      operationId: getWorkforceSession
      tags: [operations-auth]
      summary: Resolve the current workforce session
      security:
        - WorkforceSession: []
      responses:
        "200":
          description: Current workforce identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceSession"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
    delete:
      operationId: deleteWorkforceSession
      tags: [operations-auth]
      summary: Revoke the current workforce session
      security:
        - WorkforceSession: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"

  /v1/internal/operations/summary:
    get:
      operationId: getOperationsSummary
      tags: [operations]
      summary: Get the synthetic internal operations health summary
      description: Demo/PostgreSQL only. Requires a durable, server-resolved workforce session.
      security:
        - WorkforceSession: []
      responses:
        "200":
          description: Operational counts from durable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSummary"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/transfers:
    get:
      operationId: listOperationsTransfers
      tags: [operations]
      summary: Search synthetic transfers for support troubleshooting
      security:
        - WorkforceSession: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching synthetic transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsTransfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/customers:
    get:
      operationId: listOperationsCustomers
      tags: [operations]
      summary: Search synthetic customers for support review
      security:
        - WorkforceSession: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Synthetic customer support directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsCustomer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/transfers/{transferId}:
    get:
      operationId: getOperationsTransfer
      tags: [operations]
      summary: Get a synthetic transfer troubleshooting timeline
      security:
        - WorkforceSession: []
      parameters:
        - $ref: "#/components/parameters/TransferId"
      responses:
        "200":
          description: Durable transfer, provider, workflow, reconciliation, and audit evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsTransferDetail"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/reconciliation/exceptions:
    get:
      operationId: listOperationsReconciliationExceptions
      tags: [operations]
      summary: List durable reconciliation exceptions
      security:
        - WorkforceSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Reconciliation exceptions ordered for review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsReconciliationException"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/audit-events:
    get:
      operationId: listOperationsAuditEvents
      tags: [operations]
      summary: List immutable synthetic audit events
      security:
        - WorkforceSession: []
      parameters:
        - name: entityId
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Append-only audit event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsAuditEvent"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

components:
  securitySchemes:
    WorkforceSession:
      type: apiKey
      in: cookie
      name: samra_ops_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationProblem:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ConflictProblem:
      description: Domain or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ExpiredProblem:
      description: Quote expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    NotFoundProblem:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Unavailable:
      description: Demo backend or database is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    UnauthorizedProblem:
      description: Workforce authentication is required or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ForbiddenProblem:
      description: The authenticated workforce role lacks permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"

  schemas:
    WorkforceLoginRequest:
      type: object
      additionalProperties: false
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required: [loginName, password]

    WorkforceSession:
      type: object
      additionalProperties: false
      properties:
        operatorId: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum:
            [
              support_readonly,
              operations_analyst,
              compliance_readonly,
              administrator,
            ]
        expiresAt: { type: string, format: date-time }
      required: [operatorId, displayName, role, expiresAt]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]

    Money:
      type: object
      description: Exact minor units serialized as a base-10 string.
      properties:
        currency:
          type: string
          enum: [USD, ETB]
        minorUnits:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
      required: [currency, minorUnits]

    UsdMoney:
      type: object
      description: Exact USD minor units serialized as a base-10 string.
      properties:
        currency:
          type: string
          enum: [USD]
        minorUnits:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
      required: [currency, minorUnits]

    EtbMoney:
      type: object
      description: Exact ETB minor units serialized as a base-10 string.
      properties:
        currency:
          type: string
          enum: [ETB]
        minorUnits:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
      required: [currency, minorUnits]

    CurrentCustomer:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        synthetic:
          type: boolean
          const: true
        backendMode:
          type: string
          enum: [demo]
      required: [id, displayName, synthetic, backendMode]

    BankAccountDeliveryInput:
      type: object
      properties:
        method:
          type: string
          const: bank
        bankId:
          type: string
          enum: [cbe, awash]
        accountNumber:
          type: string
          pattern: "^[0-9]{8,24}$"
      required: [method, bankId, accountNumber]
      additionalProperties: false

    MobileWalletDeliveryInput:
      type: object
      properties:
        method:
          type: string
          const: wallet
        walletId:
          type: string
          enum: [telebirr, cbebirr]
        phoneNumber:
          type: string
          pattern: '^\+251[0-9]{9}$'
      required: [method, walletId, phoneNumber]
      additionalProperties: false

    BeneficiaryDeliveryInput:
      oneOf:
        - $ref: "#/components/schemas/BankAccountDeliveryInput"
        - $ref: "#/components/schemas/MobileWalletDeliveryInput"
      discriminator:
        propertyName: method
        mapping:
          bank: "#/components/schemas/BankAccountDeliveryInput"
          wallet: "#/components/schemas/MobileWalletDeliveryInput"

    BankAccountDeliveryDetails:
      type: object
      properties:
        method:
          type: string
          const: bank
        bankId:
          type: string
          enum: [cbe, awash]
        institutionName:
          type: string
        accountNumberLast4:
          type: string
          pattern: "^[0-9]{4}$"
      required: [method, bankId, institutionName, accountNumberLast4]

    MobileWalletDeliveryDetails:
      type: object
      properties:
        method:
          type: string
          const: wallet
        walletId:
          type: string
          enum: [telebirr, cbebirr]
        institutionName:
          type: string
        phoneNumberLast4:
          type: string
          pattern: "^[0-9]{4}$"
      required: [method, walletId, institutionName, phoneNumberLast4]

    BeneficiaryDeliveryDetails:
      oneOf:
        - $ref: "#/components/schemas/BankAccountDeliveryDetails"
        - $ref: "#/components/schemas/MobileWalletDeliveryDetails"
      discriminator:
        propertyName: method
        mapping:
          bank: "#/components/schemas/BankAccountDeliveryDetails"
          wallet: "#/components/schemas/MobileWalletDeliveryDetails"

    Beneficiary:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        city:
          type: string
        countryCode:
          type: string
          const: ET
        deliveryDetails:
          $ref: "#/components/schemas/BeneficiaryDeliveryDetails"
        status:
          type: string
          const: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          displayName,
          city,
          countryCode,
          deliveryDetails,
          status,
          createdAt,
          updatedAt,
        ]

    CreateBeneficiaryRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 100
        city:
          type: string
          minLength: 2
          maxLength: 100
        countryCode:
          type: string
          const: ET
        deliveryDetails:
          $ref: "#/components/schemas/BeneficiaryDeliveryInput"
      required: [displayName, city, countryCode, deliveryDetails]
      additionalProperties: false

    UpdateBeneficiaryRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 100
        city:
          type: string
          minLength: 2
          maxLength: 100
        deliveryDetails:
          $ref: "#/components/schemas/BeneficiaryDeliveryInput"
      additionalProperties: false

    AccountSummary:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [domestic]
        displayName:
          type: string
        last4:
          type: string
          pattern: "^[0-9]{4}$"
        currency:
          type: string
          enum: [USD]
        bookBalance:
          $ref: "#/components/schemas/UsdMoney"
        availableBalance:
          $ref: "#/components/schemas/UsdMoney"
        status:
          type: string
          enum: [active, restricted, closed]
      required:
        [
          id,
          kind,
          displayName,
          last4,
          currency,
          bookBalance,
          availableBalance,
          status,
        ]

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        sourceType:
          type: string
          enum: [opening_balance, remittance]
        sourceId:
          type: string
        occurredAt:
          type: string
          format: date-time
        title:
          type: string
        category:
          type: string
          enum: [deposit, remittance, fee, refund]
        direction:
          type: string
          enum: [credit, debit]
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [pending, completed, failed, reversed]
