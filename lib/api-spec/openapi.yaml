              missing_internally,
              missing_externally,
              duplicate_external,
              amount_mismatch,
              currency_mismatch,
              status_mismatch,
              timing_difference,
              unexpected_external,
            ]
        internalAmount:
          $ref: "#/components/schemas/Money"
        externalAmount:
          $ref: "#/components/schemas/Money"
      required: [id, matchKey, classification]

    ReconciliationRun:
      type: object
      properties:
        id:
