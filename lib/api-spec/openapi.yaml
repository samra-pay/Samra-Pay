          type: string
          enum: [ETB]
        fundingMethods:
          type: array
          items:
            type: string
            enum: [samra_balance]
        deliveryMethods:
          type: array
          items:
            type: string
            enum: [bank, wallet]
      required:
        [sourceCurrency, destinationCurrency, fundingMethods, deliveryMethods]

    CreateQuoteRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
        beneficiaryId:
          type: string
        sendAmount:
          $ref: "#/components/schemas/UsdMoney"
        fundingMethod:
          type: string
          enum: [samra_balance]
        deliveryMethod:
          type: string
          enum: [bank, wallet]
      required:
        [
          sourceAccountId,
          beneficiaryId,
          sendAmount,
          fundingMethod,
          deliveryMethod,
        ]

    RemittanceQuote:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, expired, consumed]
        expiresAt:
          type: string
          format: date-time
        sourceAccountId:
          type: string
        beneficiaryId:
          type: string
        sendAmount:
          $ref: "#/components/schemas/UsdMoney"
        feeAmount:
          $ref: "#/components/schemas/UsdMoney"
        totalDebit:
          $ref: "#/components/schemas/UsdMoney"
        receiveAmount:
          $ref: "#/components/schemas/EtbMoney"
        exchangeRate:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        fundingMethod:
          type: string
          enum: [samra_balance]
        deliveryMethod:
          type: string
          enum: [bank, wallet]
        estimatedDelivery:
          type: string
      required:
        [
          id,
          status,
          expiresAt,
          sourceAccountId,
          beneficiaryId,
          sendAmount,
          feeAmount,
          totalDebit,
          receiveAmount,
          exchangeRate,
          fundingMethod,
          deliveryMethod,
          estimatedDelivery,
        ]

