          displayName,
          countryCode,
          status,
          accountCount,
          beneficiaryCount,
          transferCount,
          completedTransferCount,
          totalSent,
          lastTransferAt,
          createdAt,
        ]

    OperationsTransfer:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        beneficiaryDisplay: { type: string }
