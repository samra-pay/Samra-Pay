openapi: 3.1.0
info:
  # Do not change the title. Generated import paths depend on it.
  title: Api
  version: 0.2.0
  description: Samra Pay synthetic architecture-foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: customer
  - name: accounts
  - name: activity
  - name: remittance
  - name: demo
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Process liveness
      responses:
        "200":
          description: The API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/me:
    get:
      operationId: getCurrentCustomer
      tags: [customer]
      summary: Get the synthetic demo customer
      responses:
        "200":
          description: Current synthetic customer and runtime mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCustomer"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List ledger-derived customer accounts
      responses:
        "200":
          description: Customer account summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List ledger-derived customer activity
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/options:
    get:
      operationId: getRemittanceOptions
      tags: [remittance]
      summary: List supported synthetic remittance options
      responses:
        "200":
          description: Synthetic funding and delivery options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemittanceOptions"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/quotes:
    post:
      operationId: createRemittanceQuote
      tags: [remittance]
      summary: Create an immutable server-calculated quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemittanceQuote"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers:
    get:
      operationId: listRemittanceTransfers
      tags: [remittance]
      summary: List customer remittance transfers
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Transfer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPage"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createRemittanceTransfer
      tags: [remittance]
      summary: Reserve funds and create a synthetic transfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "410":
          $ref: "#/components/responses/ExpiredProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers/{transferId}:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    get:
      operationId: getRemittanceTransfer
      tags: [remittance]
      summary: Get a transfer and its normalized timeline
      responses:
        "200":
          description: Transfer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers/{transferId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    post:
      operationId: cancelRemittanceTransfer
      tags: [remittance]
      summary: Cancel a transfer before its non-cancellable boundary
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/remittance/transfers/{transferId}/scenario:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    post:
      operationId: selectDemoTransferScenario
      tags: [demo]
      summary: Select and advance a deterministic fake-provider scenario
      description: Available only when the backend is explicitly in demo/fake mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectScenarioRequest"
      responses:
        "200":
          description: Updated transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/reconciliation/runs:
    post:
      operationId: runDemoReconciliation
      tags: [demo]
      summary: Run deterministic fake-provider reconciliation
      description: Available only when the backend is explicitly in demo/fake mode.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunReconciliationRequest"
      responses:
        "201":
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/reconciliation/runs/{runId}:
    get:
      operationId: getDemoReconciliationRun
      tags: [demo]
      summary: Get a deterministic reconciliation result
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationProblem:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ConflictProblem:
      description: Domain or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ExpiredProblem:
      description: Quote expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    NotFoundProblem:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Unavailable:
      description: Demo backend or database is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]

    Money:
      type: object
      description: Exact minor units serialized as a base-10 string.
      properties:
        currency:
          type: string
          enum: [USD, ETB]
        minorUnits:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
      required: [currency, minorUnits]

    UsdMoney:
      type: object
      description: Exact USD minor units serialized as a base-10 string.
      properties:
        currency:
          type: string
          enum: [USD]
        minorUnits:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
      required: [currency, minorUnits]

    EtbMoney:
      type: object
      description: Exact ETB minor units serialized as a base-10 string.
      properties:
        currency:
          type: string
          enum: [ETB]
        minorUnits:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
      required: [currency, minorUnits]

    CurrentCustomer:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        synthetic:
          type: boolean
          const: true
        backendMode:
          type: string
          enum: [demo]
      required: [id, displayName, synthetic, backendMode]

    AccountSummary:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [domestic]
        displayName:
          type: string
        last4:
          type: string
          pattern: "^[0-9]{4}$"
        currency:
          type: string
          enum: [USD]
        bookBalance:
          $ref: "#/components/schemas/UsdMoney"
        availableBalance:
          $ref: "#/components/schemas/UsdMoney"
        status:
          type: string
          enum: [active, restricted, closed]
      required:
        [
          id,
          kind,
          displayName,
          last4,
          currency,
          bookBalance,
          availableBalance,
          status,
        ]

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        sourceType:
          type: string
          enum: [opening_balance, remittance]
        sourceId:
          type: string
        occurredAt:
          type: string
          format: date-time
        title:
          type: string
        category:
          type: string
          enum: [deposit, remittance, fee, refund]
        direction:
          type: string
          enum: [credit, debit]
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [pending, completed, failed, reversed]
      required:
        [
          id,
          accountId,
          sourceType,
          sourceId,
          occurredAt,
          title,
          category,
          direction,
          amount,
          status,
        ]

    ActivityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required: [items, nextCursor]

    RemittanceOptions:
      type: object
      properties:
        sourceCurrency:
          type: string
          enum: [USD]
        destinationCurrency:
          type: string
          enum: [ETB]
        fundingMethods:
          type: array
          items:
            type: string
            enum: [samra_balance]
        deliveryMethods:
          type: array
          items:
            type: string
            enum: [bank, wallet]
      required:
        [sourceCurrency, destinationCurrency, fundingMethods, deliveryMethods]

    CreateQuoteRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
        beneficiaryId:
          type: string
        sendAmount:
          $ref: "#/components/schemas/UsdMoney"
        fundingMethod:
          type: string
          enum: [samra_balance]
        deliveryMethod:
          type: string
          enum: [bank, wallet]
      required:
        [
          sourceAccountId,
          beneficiaryId,
          sendAmount,
          fundingMethod,
          deliveryMethod,
        ]

    RemittanceQuote:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, expired, consumed]
        expiresAt:
          type: string
          format: date-time
        sourceAccountId:
          type: string
        beneficiaryId:
          type: string
        sendAmount:
          $ref: "#/components/schemas/UsdMoney"
        feeAmount:
          $ref: "#/components/schemas/UsdMoney"
        totalDebit:
          $ref: "#/components/schemas/UsdMoney"
        receiveAmount:
          $ref: "#/components/schemas/EtbMoney"
        exchangeRate:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        fundingMethod:
          type: string
          enum: [samra_balance]
        deliveryMethod:
          type: string
          enum: [bank, wallet]
        estimatedDelivery:
          type: string
      required:
        [
          id,
          status,
          expiresAt,
          sourceAccountId,
          beneficiaryId,
          sendAmount,
          feeAmount,
          totalDebit,
          receiveAmount,
          exchangeRate,
          fundingMethod,
          deliveryMethod,
          estimatedDelivery,
        ]

    CreateTransferRequest:
      type: object
      properties:
        quoteId:
          type: string
      required: [quoteId]

    TransferTimelineItem:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/TransferStatus"
        occurredAt:
          type: string
          format: date-time
        detail:
          type: string
      required: [status, occurredAt]

    TransferStatus:
      type: string
      enum:
        [
          created,
          funds_reserved,
          submitted,
          in_transit,
          payout_pending,
          completed,
          failed,
          refund_pending,
          refunded,
          cancelled,
        ]

    Transfer:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/TransferStatus"
        recipientDisplay:
          type: string
        quoteSnapshot:
          $ref: "#/components/schemas/RemittanceQuote"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        failureCode:
          anyOf:
            - type: string
            - type: "null"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TransferTimelineItem"
      required:
        [
          id,
          status,
          recipientDisplay,
          quoteSnapshot,
          createdAt,
          updatedAt,
          failureCode,
          timeline,
        ]

    TransferPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required: [items, nextCursor]

    TransferDemoScenario:
      type: string
      enum:
        [
          happy_path,
          caliza_rejection,
          chapa_failure,
          settlement_refund,
          timeout_retry,
          duplicate_event,
          out_of_order_event,
        ]

    ReconciliationDemoScenario:
      type: string
      enum: [happy_path, reconciliation_amount_mismatch, missing_report_line]

    SelectScenarioRequest:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/TransferDemoScenario"
      required: [scenario]

    RunReconciliationRequest:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/ReconciliationDemoScenario"

    ReconciliationItem:
      type: object
      properties:
        id:
          type: string
        matchKey:
          type: string
        classification:
          type: string
          enum:
            [
              matched,
              missing_internally,
              missing_externally,
              duplicate_external,
              amount_mismatch,
              currency_mismatch,
              status_mismatch,
              timing_difference,
              unexpected_external,
            ]
        internalAmount:
          $ref: "#/components/schemas/Money"
        externalAmount:
          $ref: "#/components/schemas/Money"
      required: [id, matchKey, classification]

    ReconciliationRun:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [running, completed, failed]
        provider:
          type: string
          enum: [rain, caliza, chapa]
        startedAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationItem"
      required: [id, status, provider, startedAt, completedAt, items]

    ApiProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        traceId:
          type: string
      required: [type, title, status, code]
