          beneficiaryDisplay,
          status,
          fundingStatus,
          payoutStatus,
          reconciliationStatus,
          sourceAmount,
          feeAmount,
          totalDebit,
          destinationAmount,
          workflowState,
          workflowAttempts,
          workflowLastError,
          createdAt,
          updatedAt,
        ]

