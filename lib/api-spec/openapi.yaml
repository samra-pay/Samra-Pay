      type: object
      properties:
        quoteId:
          type: string
      required: [quoteId]

    TransferTimelineItem:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/TransferStatus"
        occurredAt:
          type: string
          format: date-time
        detail:
          type: string
      required: [status, occurredAt]

    TransferStatus:
      type: string
      enum:
        [
          created,
          funds_reserved,
          submitted,
          in_transit,
          payout_pending,
          completed,
          failed,
          refund_pending,
          refunded,
          cancelled,
        ]

    Transfer:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/TransferStatus"
        recipientDisplay:
          type: string
