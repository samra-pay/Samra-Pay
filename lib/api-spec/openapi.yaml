      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/TransferDemoScenario"
      required: [scenario]

    RunReconciliationRequest:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/ReconciliationDemoScenario"

    ReconciliationItem:
      type: object
      properties:
        id:
          type: string
        matchKey:
          type: string
        classification:
          type: string
          enum:
            [
