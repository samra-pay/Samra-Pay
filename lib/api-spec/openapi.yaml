openapi: 3.1.0
info:
  # Do not change the title. Generated import paths depend on it.
  title: Api
  version: 0.2.0
  description: Samra Pay synthetic architecture-foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: customer
  - name: onboarding
  - name: acquisition
  - name: marketing
  - name: accounts
  - name: activity
  - name: beneficiaries
  - name: remittance
  - name: demo
  - name: operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Process liveness
      responses:
        "200":
          description: The API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Runtime and persistence readiness
      responses:
        "200":
          description: The configured runtime is ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: The configured runtime is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /v1/me:
    get:
      operationId: getCurrentCustomer
      tags: [customer]
      summary: Get the current Samra Pay customer
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Current synthetic customer and runtime mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCustomer"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/acquisition/events:
    post:
      operationId: recordCustomerAcquisitionEvent
      tags: [acquisition]
      summary: Record one privacy-safe, low-trust acquisition event
      description: Creates or resumes an opaque first-party acquisition session. The server accepts only allowlisted event types and normalized attribution slugs; it does not accept URLs, referrers, device fingerprints, customer identifiers, PII, financial state, or client timestamps.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCustomerAcquisitionEventRequest"
      responses:
        "200":
          description: Existing event safely replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAcquisitionEventReceipt"
        "201":
          description: Acquisition event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAcquisitionEventReceipt"
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/marketing-leads:
    post:
      operationId: registerVerifiedMarketingLead
      tags: [marketing]
      summary: Request email ownership confirmation; receipt does not grant email or advertising permission
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiedMarketingLeadRequest"
      responses:
        "202":
          description: Request processed; no claim of advertising match or delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingAcceptance"
        "422": { description: Invalid request or expired capability }
        "429": { description: Request rate exceeded }
        "503": { description: Temporarily unavailable }

  /v1/marketing-leads/confirm:
    post:
      operationId: confirmMarketingLead
      tags: [marketing]
      summary: Confirm email ownership using an expiring bearer token and optional advertising choice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmMarketingLeadRequest"
      responses:
        "200":
          description: Request processed; no claim of advertising match or delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingConfirmation"
        "422": { description: Invalid request or expired capability }
        "429": { description: Request rate exceeded }
        "503": { description: Temporarily unavailable }

  /v1/marketing-leads/preferences:
    post:
      operationId: withdrawMarketingPermission
      tags: [marketing]
      summary: Withdraw permission using an email-delivered purpose-limited bearer capability
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingPreferenceRequest"
      responses:
        "200":
          description: Request processed; no claim of advertising match or delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingAcceptance"
        "422": { description: Invalid request or expired capability }
        "429": { description: Request rate exceeded }
        "503": { description: Temporarily unavailable }

  /v1/marketing-leads/resend-webhook:
    post:
      operationId: receiveMarketingResendWebhook
      tags: [marketing]
      summary: Receive raw-body Svix-signed Resend events
      description: Requires svix-id, svix-timestamp and svix-signature headers verified with the endpoint secret. Deduplicates signed events and only reduces permissions. No raw event payload is retained.
      security: []
      parameters:
        - {
            in: header,
            name: svix-id,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: svix-timestamp,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: svix-signature,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendMarketingEvent"
      responses:
        "200": { description: Signed event processed or safely replayed }
        "400": { description: Invalid signature or body }
        "422": { description: Invalid event }
        "429": { description: Request rate exceeded }
        "503": { description: Retryable processing failure }

  /v1/waitlist/subscriptions:
    post:
      operationId: subscribeWaitlist
      tags: [marketing]
      summary: Join the public launch waitlist with explicit consent
      description: Stores the normalized email separately from acquisition telemetry and records the exact consent notice version, locale, server timestamp, and idempotency evidence. The endpoint accepts no customer, identity, device, or financial data.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeWaitlistRequest"
      responses:
        "202":
          description: The subscription and consent evidence were accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSubscriptionReceipt"
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/acquisition/bind:
    post:
      operationId: bindCustomerAcquisitionSession
      tags: [acquisition]
      summary: Bind an opaque acquisition session to the authenticated Samra customer
      description: Links a session exactly once after the Auth0 subject has a durable Samra customer binding. The Auth0 subject and customer identifiers are not returned in funnel reports.
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindCustomerAcquisitionSessionRequest"
      responses:
        "200":
          description: Existing session link safely replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAcquisitionLinkReceipt"
        "201":
          description: Session linked to the authenticated Samra customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAcquisitionLinkReceipt"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/onboarding:
    post:
      operationId: startCustomerOnboarding
      tags: [onboarding]
      summary: Atomically create or resume the authenticated customer onboarding aggregate
      description: Creates a Samra-owned pending customer, Auth0 identity binding, and onboarding aggregate exactly once. Auth0 profile claims are not copied into the customer record.
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Existing onboarding aggregate resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOnboarding"
        "201":
          description: Customer onboarding aggregate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOnboarding"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: getCustomerOnboarding
      tags: [onboarding]
      summary: Resume the authenticated customer onboarding aggregate
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Current durable onboarding state and next allowed actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOnboarding"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/onboarding/consents:
    post:
      operationId: submitCustomerConsentBundle
      tags: [onboarding]
      summary: Record an immutable, versioned required-consent bundle
      description: The server accepts only the current non-production consent catalog. All decisions, the aggregate transition, idempotency evidence, and audit evidence commit atomically.
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCustomerConsentBundleRequest"
      responses:
        "200":
          description: Consent decisions recorded or safely replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOnboarding"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/onboarding/identity:
    post:
      operationId: startCustomerIdentityVerification
      tags: [onboarding]
      summary: Create or resume the Samra-owned identity verification case
      description: Creates one durable identity case and idempotently starts the configured provider inquiry. The response contains normalized Samra state only and no provider payload or customer PII.
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Existing identity case resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIdentityCase"
        "201":
          description: Identity case created and provider inquiry attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIdentityCase"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: getCustomerIdentityCase
      tags: [onboarding]
      summary: Resume the authenticated customer identity verification case
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Current normalized identity case state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIdentityCase"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/onboarding/wallet:
    post:
      operationId: startCustomerWalletProvisioning
      tags: [onboarding]
      summary: Create or resume the Samra-owned customer wallet record
      description: Records the current non-production wallet provisioning disclosure, enforces approved identity state, and idempotently calls the configured wallet provider. The response exposes normalized Samra state only; it does not expose provider identifiers, credentials, customer PII, balances, funding, or remittance entitlements.
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCustomerWalletProvisioningRequest"
      responses:
        "200":
          description: Existing wallet provisioning record resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerWallet"
        "201":
          description: Wallet record created and the configured non-production provider mapping attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerWallet"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: getCustomerWallet
      tags: [onboarding]
      summary: Resume the authenticated customer's normalized wallet state
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Current normalized wallet state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerWallet"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List ledger-derived customer accounts
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Customer account summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List ledger-derived customer activity
      security:
        - CustomerBearer: []
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/beneficiaries:
    get:
      operationId: listBeneficiaries
      tags: [beneficiaries]
      summary: List active beneficiaries owned by the current actor
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Active synthetic beneficiaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createBeneficiary
      tags: [beneficiaries]
      summary: Create a synthetic beneficiary for the current actor
      security:
        - CustomerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBeneficiaryRequest"
      responses:
        "201":
          description: Beneficiary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/beneficiaries/{beneficiaryId}:
    parameters:
      - $ref: "#/components/parameters/BeneficiaryId"
    get:
      operationId: getBeneficiary
      tags: [beneficiaries]
      summary: Get an active beneficiary owned by the current actor
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Beneficiary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateBeneficiary
      tags: [beneficiaries]
      summary: Update an active beneficiary owned by the current actor
      security:
        - CustomerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBeneficiaryRequest"
      responses:
        "200":
          description: Beneficiary updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteBeneficiary
      tags: [beneficiaries]
      summary: Soft-delete an active beneficiary owned by the current actor
      security:
        - CustomerBearer: []
      responses:
        "204":
          description: Beneficiary soft-deleted
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/options:
    get:
      operationId: getRemittanceOptions
      tags: [remittance]
      summary: List supported synthetic remittance options
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Synthetic funding and delivery options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemittanceOptions"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/quotes:
    post:
      operationId: createRemittanceQuote
      tags: [remittance]
      summary: Create an immutable server-calculated quote
      security:
        - CustomerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemittanceQuote"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers:
    get:
      operationId: listRemittanceTransfers
      tags: [remittance]
      summary: List customer remittance transfers
      security:
        - CustomerBearer: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Transfer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPage"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createRemittanceTransfer
      tags: [remittance]
      summary: Reserve funds and create a synthetic transfer
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "410":
          $ref: "#/components/responses/ExpiredProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers/{transferId}:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    get:
      operationId: getRemittanceTransfer
      tags: [remittance]
      summary: Get a transfer and its normalized timeline
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Transfer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remittance/transfers/{transferId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    post:
      operationId: cancelRemittanceTransfer
      tags: [remittance]
      summary: Cancel a transfer before its non-cancellable boundary
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/remittance/transfers/{transferId}/scenario:
    parameters:
      - $ref: "#/components/parameters/TransferId"
    post:
      operationId: selectDemoTransferScenario
      tags: [demo]
      summary: Select and advance a deterministic fake-provider scenario
      description: Available only in non-production demo mode when remittance, identity, and wallet provider modes are all explicitly fake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectScenarioRequest"
      responses:
        "200":
          description: Updated transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/onboarding/identity/{identityCaseId}/decision:
    parameters:
      - $ref: "#/components/parameters/IdentityCaseId"
    post:
      operationId: advanceDemoCustomerIdentity
      tags: [demo]
      summary: Apply a deterministic fake Persona decision
      description: Available only in non-production demo mode when remittance, identity, and wallet provider modes are all explicitly fake. It stores digest-only provider evidence and never accepts provider payloads or customer PII.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceDemoCustomerIdentityRequest"
      responses:
        "200":
          description: Provider evidence disposition and current identity case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIdentityProviderEventResult"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/reconciliation/runs:
    post:
      operationId: runDemoReconciliation
      tags: [demo]
      summary: Run deterministic fake-provider reconciliation
      description: Available only in non-production demo mode when remittance, identity, and wallet provider modes are all explicitly fake.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunReconciliationRequest"
      responses:
        "201":
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/dev/reconciliation/runs/{runId}:
    get:
      operationId: getDemoReconciliationRun
      tags: [demo]
      summary: Get a deterministic reconciliation result
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/internal/auth/session:
    post:
      operationId: createWorkforceSession
      tags: [operations-auth]
      summary: Create an opaque workforce session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceLoginRequest"
      responses:
        "201":
          description: Authenticated workforce identity; session token is returned only as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceSession"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
    get:
      operationId: getWorkforceSession
      tags: [operations-auth]
      summary: Resolve the current workforce session
      security:
        - WorkforceSession: []
      responses:
        "200":
          description: Current workforce identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceSession"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
    delete:
      operationId: deleteWorkforceSession
      tags: [operations-auth]
      summary: Revoke the current workforce session
      security:
        - WorkforceSession: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"

  /v1/internal/operations/summary:
    get:
      operationId: getOperationsSummary
      tags: [operations]
      summary: Get the synthetic internal operations health summary
      description: Demo/PostgreSQL only. Requires a durable, server-resolved workforce session.
      security:
        - WorkforceSession: []
      responses:
        "200":
          description: Operational counts from durable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSummary"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/customer-funnel:
    get:
      operationId: getOperationsCustomerFunnel
      tags: [operations]
      summary: Get aggregate customer funnel and acquisition attribution truth
      description: Returns only aggregate, privacy-safe counts. Onboarding, identity, activation, and completed-send milestones are derived from Samra-owned PostgreSQL state; client events cannot claim those milestones.
      security:
        - WorkforceSession: []
      parameters:
        - name: cohortFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: cohortTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Aggregate acquisition and customer milestone report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerFunnelReport"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /v1/internal/operations/transfers:
    get:
      operationId: listOperationsTransfers
      tags: [operations]
      summary: Search synthetic transfers for support troubleshooting
      security:
        - WorkforceSession: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching synthetic transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsTransfer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/customers:
    get:
      operationId: listOperationsCustomers
      tags: [operations]
      summary: Search synthetic customers for support review
      security:
        - WorkforceSession: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Synthetic customer support directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsCustomer"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/transfers/{transferId}:
    get:
      operationId: getOperationsTransfer
      tags: [operations]
      summary: Get a synthetic transfer troubleshooting timeline
      security:
        - WorkforceSession: []
      parameters:
        - $ref: "#/components/parameters/TransferId"
      responses:
        "200":
          description: Durable transfer, provider, workflow, reconciliation, and audit evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsTransferDetail"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/transfers/{transferId}/cancel:
    post:
      operationId: cancelOperationsTransfer
      tags: [operations]
      summary: Cancel an eligible synthetic transfer and release its active hold
      description: Demo/PostgreSQL only. Restricted to operations analysts and administrators. The transfer cancellation, hold release, and operator audit records share one atomic transaction.
      security:
        - WorkforceSession: []
      parameters:
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOperationsTransferRequest"
      responses:
        "200":
          description: Cancelled transfer with its durable troubleshooting evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsTransferDetail"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /v1/internal/operations/reconciliation/exceptions:
    get:
      operationId: listOperationsReconciliationExceptions
      tags: [operations]
      summary: List durable reconciliation exceptions
      security:
        - WorkforceSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Reconciliation exceptions ordered for review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsReconciliationException"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/reconciliation/exceptions/{exceptionId}/resolve:
    post:
      operationId: resolveOperationsReconciliationException
      tags: [operations]
      summary: Resolve an amount mismatch through a balanced suspense journal
      description: PostgreSQL only. Restricted to administrators. The derived correction journal, exception transition, transfer reconciliation state, immutable resolution history, and operator audit share one atomic transaction. No direct balance or posting edit is exposed.
      security:
        - WorkforceSession: []
      parameters:
        - $ref: "#/components/parameters/ReconciliationExceptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveOperationsReconciliationExceptionRequest"
      responses:
        "200":
          description: Resolved exception with durable journal evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReconciliationException"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /v1/internal/operations/audit-events:
    get:
      operationId: listOperationsAuditEvents
      tags: [operations]
      summary: List immutable synthetic audit events
      security:
        - WorkforceSession: []
      parameters:
        - name: entityId
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Append-only audit event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsAuditEvent"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }

  /v1/internal/operations/cases:
    get:
      operationId: listOperationsCases
      tags: [operations]
      summary: List durable customer-support cases
      security:
        - WorkforceSession: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OperationsCaseStatus" }
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/OperationsCasePriority" }
        - name: assignedTo
          in: query
          schema: { type: string, maxLength: 128 }
        - name: search
          in: query
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Prioritized case queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationsCase" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
    post:
      operationId: createOperationsCase
      tags: [operations]
      summary: Open an auditable support case without changing financial state
      security:
        - WorkforceSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperationsCaseRequest" }
      responses:
        "201":
          description: Case opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsCaseDetail" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /v1/internal/operations/cases/{caseId}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getOperationsCase
      tags: [operations]
      summary: Get a support case, internal notes, and immutable history
      security:
        - WorkforceSession: []
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsCaseDetail" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
    patch:
      operationId: updateOperationsCase
      tags: [operations]
      summary: Update workflow metadata using optimistic concurrency
      security:
        - WorkforceSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOperationsCaseRequest" }
      responses:
        "200":
          description: Updated case detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsCaseDetail" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /v1/internal/operations/cases/{caseId}/notes:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: addOperationsCaseNote
      tags: [operations]
      summary: Append an immutable internal note
      security:
        - WorkforceSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AddOperationsCaseNoteRequest" }
      responses:
        "200":
          description: Case detail with appended note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsCaseDetail" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

components:
  securitySchemes:
    CustomerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 RS256 access token for the configured Samra Pay API audience. ID tokens are not accepted.
    WorkforceSession:
      type: apiKey
      in: cookie
      name: samra_ops_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema:
        type: string
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    IdentityCaseId:
      name: identityCaseId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ReconciliationExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationProblem:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ConflictProblem:
      description: Domain or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ExpiredProblem:
      description: Quote expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    NotFoundProblem:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Unavailable:
      description: Demo backend or database is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    UnauthorizedProblem:
      description: Customer bearer or workforce authentication is required or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ForbiddenProblem:
      description: The authenticated customer identity is unbound, restricted, or not activated through onboarding, or the workforce role lacks permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"

  schemas:
    ResendMarketingEvent:
      type: object
      additionalProperties: true
      required: [type, data]
      properties:
        type: { type: string, maxLength: 80 }
        data: { type: object, additionalProperties: true }
    MarketingAcceptance:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    MarketingConfirmation:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
        preferencesUrl: { type: string, maxLength: 600 }
    VerifiedMarketingLeadRequest:
      type: object
      additionalProperties: false
      required:
        [
          email,
          emailConsent,
          adsConsent,
          locale,
          noticeVersion,
          website,
          attribution,
        ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        emailConsent: { type: boolean, enum: [true] }
        adsConsent: { type: boolean }
        locale: { type: string, enum: [en, am] }
        noticeVersion: { type: string, enum: [marketing-2026-09-09] }
        website: { type: string, maxLength: 300 }
        attribution:
          type: object
          additionalProperties: false
          properties:
            source:
              { type: string, enum: [facebook, instagram, x, youtube, tiktok] }
            medium: { type: string, enum: [social] }
            campaign:
              { type: string, enum: [social_profile, ask_samra, product_demo] }
            content: { type: string, enum: [bio, channel_link, post, video] }
    ConfirmMarketingLeadRequest:
      type: object
      additionalProperties: false
      required: [token, adsConsent]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
        adsConsent: { type: boolean }
    MarketingPreferenceRequest:
      type: object
      additionalProperties: false
      required: [token, scope]
      properties:
        token: { type: string, maxLength: 512 }
        scope: { type: string, enum: [all, ads] }

    SubscribeWaitlistRequest:
      type: object
      additionalProperties: false
      required: [email, consent, consentVersion, locale]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        consent:
          type: boolean
          const: true
        consentVersion:
          type: string
          pattern: "^coming-soon-[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        locale:
          type: string
          enum: [en, am]
        website:
          type: string
          maxLength: 0
          description: Honeypot field. Real clients must leave it empty.

    WaitlistSubscriptionReceipt:
      type: object
      additionalProperties: false
      required: [accepted, acceptedAt]
      properties:
        accepted:
          type: boolean
          const: true
        acceptedAt:
          type: string
          format: date-time

    CustomerOnboardingState:
      type: string
      enum:
        - not_started
        - authenticated
        - consent_pending
        - identity_in_progress
        - identity_review
        - identity_approved
        - bank_link_pending
        - bank_matched
        - wallet_consent_pending
        - wallet_provisioning
        - wallet_ready
        - funding_ready
        - activated
        - restricted

    CustomerAcquisitionEventType:
      type: string
      enum:
        [landing_view, app_open, quote_started, quote_completed, signup_started]

    CustomerAcquisitionChannel:
      type: string
      enum:
        [
          direct,
          organic_search,
          organic_social,
          paid_search,
          paid_social,
          referral,
          email,
          partner,
          offline,
          unknown,
        ]

    CustomerAcquisitionAttribution:
      type: object
      additionalProperties: false
      properties:
        channel:
          $ref: "#/components/schemas/CustomerAcquisitionChannel"
        source:
          anyOf:
            - type: string
              pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
            - type: "null"
        medium:
          anyOf:
            - type: string
              pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
            - type: "null"
        campaign:
          anyOf:
            - type: string
              pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
            - type: "null"
      required: [channel, source, medium, campaign]

    RecordCustomerAcquisitionEventRequest:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          pattern: "^acq_[0-9a-f]{32}$"
        eventType:
          $ref: "#/components/schemas/CustomerAcquisitionEventType"
        platform:
          type: string
          enum: [web, mobile]
        attribution:
          $ref: "#/components/schemas/CustomerAcquisitionAttribution"
      required: [eventType, platform, attribution]

    CustomerAcquisitionEventReceipt:
      type: object
      additionalProperties: false
      properties:
        sessionId: { type: string }
        eventType:
          $ref: "#/components/schemas/CustomerAcquisitionEventType"
        recorded: { type: boolean }
        recordedAt: { type: string, format: date-time }
        synthetic: { type: boolean, const: true }
      required: [sessionId, eventType, recorded, recordedAt, synthetic]

    BindCustomerAcquisitionSessionRequest:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          pattern: "^acq_[0-9a-f]{32}$"

    CustomerAcquisitionLinkReceipt:
      type: object
      additionalProperties: false
      properties:
        sessionId: { type: string }
        customerId: { type: string }
        linked: { type: boolean }
        linkedAt: { type: string, format: date-time }
        synthetic: { type: boolean, const: true }
      required: [sessionId, customerId, linked, linkedAt, synthetic]

    CustomerFunnelAttributionRow:
      allOf:
        - $ref: "#/components/schemas/CustomerAcquisitionAttribution"
        - type: object
          additionalProperties: false
          properties:
            customers: { type: integer, minimum: 0 }
          required: [customers]

    CustomerFunnelReport:
      type: object
      additionalProperties: false
      properties:
        generatedAt: { type: string, format: date-time }
        cohortFrom: { type: string, format: date-time }
        cohortTo: { type: string, format: date-time }
        eventSessions:
          type: object
          additionalProperties: false
          properties:
            landing_view: { type: integer, minimum: 0 }
            app_open: { type: integer, minimum: 0 }
            quote_started: { type: integer, minimum: 0 }
            quote_completed: { type: integer, minimum: 0 }
            signup_started: { type: integer, minimum: 0 }
          required:
            [
              landing_view,
              app_open,
              quote_started,
              quote_completed,
              signup_started,
            ]
        milestones:
          type: object
          additionalProperties: false
          properties:
