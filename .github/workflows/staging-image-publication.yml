name: Staging image publication

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a read-only review or publish the five immutable staging images
        required: true
        default: review
        type: choice
        options:
          - review
          - publish
      authorization:
        description: For publish only, enter AUTHORIZED_STAGING_IMAGE_PUBLICATION
        required: false
        type: string
      release_candidate_run_id:
        description: Successful Immutable release candidate workflow run ID for this exact main commit
        required: true
        type: string
      release_candidate_run_attempt:
        description: Exact successful release-candidate run attempt containing the immutable evidence
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: staging-image-publication-${{ github.sha }}
  cancel-in-progress: false

env:
  SAMRA_GCP_PROJECT_ID: samra-pay-staging
  SAMRA_GCP_PROJECT_NUMBER: "934122615631"
  SAMRA_GCP_ORGANIZATION_ID: "993968777863"
  SAMRA_GCP_REGION: us-east4
  SAMRA_GCP_OPERATOR_ACCOUNT: samra-github-staging@samra-pay-staging.iam.gserviceaccount.com
  SAMRA_GCP_EXPECTED_SHA: ${{ github.sha }}
  SAMRA_GCP_WORKLOAD_IDENTITY_PROVIDER: projects/934122615631/locations/global/workloadIdentityPools/samra-github-staging/providers/samra-pay-main
  SAMRA_GCP_PUBLISHER_SERVICE_ACCOUNT: samra-github-staging@samra-pay-staging.iam.gserviceaccount.com
  SAMRA_WORKFLOW_MODE: ${{ inputs.mode }}
  SAMRA_WORKFLOW_AUTHORIZATION: ${{ inputs.authorization }}
  SAMRA_RELEASE_CANDIDATE_RUN_ID: ${{ inputs.release_candidate_run_id }}
  SAMRA_RELEASE_CANDIDATE_RUN_ATTEMPT: ${{ inputs.release_candidate_run_attempt }}

jobs:
  publication:
    name: Review or publish immutable staging images
    if: >-
      github.repository == 'samra-pay/Samra-Pay' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment:
      name: staging-image-publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ "${GITHUB_REPOSITORY}" == "samra-pay/Samra-Pay" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${SAMRA_RELEASE_CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SAMRA_RELEASE_CANDIDATE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          if [[ "${SAMRA_WORKFLOW_MODE}" == "publish" ]]; then
            [[ "${SAMRA_WORKFLOW_AUTHORIZATION}" == "AUTHORIZED_STAGING_IMAGE_PUBLICATION" ]] || {
              echo "Publish mode requires the exact publication authorization." >&2
              exit 1
            }
          fi

      - name: Initialize exact release evidence paths
        id: release_artifact
        shell: bash
        run: |
          set -euo pipefail
          release_id="rc-${GITHUB_SHA:0:12}"
          artifact_name="samra-${release_id}-run-${SAMRA_RELEASE_CANDIDATE_RUN_ID}-attempt-${SAMRA_RELEASE_CANDIDATE_RUN_ATTEMPT}"
          {
            printf 'artifact_name=%s\n' "${artifact_name}"
            printf 'release_id=%s\n' "${release_id}"
          } >> "${GITHUB_OUTPUT}"
          {
            printf 'SAMRA_RELEASE_EVIDENCE_ROOT=%s\n' "${RUNNER_TEMP}/samra-release-candidate"
            printf 'SAMRA_RELEASE_RUN_METADATA=%s\n' "${RUNNER_TEMP}/samra-release-candidate-run.json"
            printf 'SAMRA_RELEASE_VERIFICATION_SUMMARY=%s\n' "${RUNNER_TEMP}/samra-release-candidate-verification.json"
          } >> "${GITHUB_ENV}"

      - name: Download the exact release-candidate artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ steps.release_artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/samra-release-candidate/artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_candidate_run_id }}

      - name: Verify release-candidate lineage before Google authentication
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node deploy/gcp/verify-release-candidate-evidence.mjs \
            --evidence-root "${SAMRA_RELEASE_EVIDENCE_ROOT}" \
            --candidate-sha "${GITHUB_SHA}" \
            --release-run-id "${SAMRA_RELEASE_CANDIDATE_RUN_ID}" \
            --release-run-attempt "${SAMRA_RELEASE_CANDIDATE_RUN_ATTEMPT}" \
            --run-metadata-output "${SAMRA_RELEASE_RUN_METADATA}" \
            --output "${SAMRA_RELEASE_VERIFICATION_SUMMARY}"

      - name: Obtain short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.SAMRA_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.SAMRA_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SAMRA_GCP_PUBLISHER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 540.0.0"
          project_id: ${{ env.SAMRA_GCP_PROJECT_ID }}

      - name: Install the pinned exact-digest security scanner
        if: inputs.mode == 'publish'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Verify federated caller
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gcloud config get-value account 2>/dev/null)" == "${SAMRA_GCP_PUBLISHER_SERVICE_ACCOUNT}" ]]
          [[ "$(gcloud config get-value project 2>/dev/null)" == "${SAMRA_GCP_PROJECT_ID}" ]]
          [[ -z "$(gcloud iam service-accounts keys list \
            --iam-account="${SAMRA_GCP_PUBLISHER_SERVICE_ACCOUNT}" \
            --project="${SAMRA_GCP_PROJECT_ID}" \
            --managed-by=user --format='value(name)')" ]]

      - name: Run read-only image publication review
        shell: bash
        run: bash deploy/gcp/publish-staging-images.sh --review

      - name: Publish the reviewed images
        if: inputs.mode == 'publish'
        shell: bash
        env:
          SAMRA_GCP_IMAGE_BUILD_APPLY: AUTHORIZED_STAGING_IMAGE_PUBLICATION
        run: |
          set -euo pipefail
          [[ "$(gcloud config get-value account 2>/dev/null)" == "${SAMRA_GCP_PUBLISHER_SERVICE_ACCOUNT}" ]]
          bash deploy/gcp/publish-staging-images.sh --apply

      - name: Preserve immutable image publication evidence
        if: inputs.mode == 'publish' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-image-publication-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/staging-release
          if-no-files-found: error
          retention-days: 365
