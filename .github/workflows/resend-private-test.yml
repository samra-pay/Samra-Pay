name: Resend launch updates review

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/launch-updates/**"
      - "artifacts/samra-pay/**"
      - "deploy/gcp/activate-public-waitlist-release.sh"
      - "deploy/gcp/coming-soon-static-hosting*"
      - "deploy/gcp/validate-coming-soon-static-hosting.mjs"
      - "firebase.json"
      - ".github/workflows/resend-private-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resend-private-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-test:
    name: Offline email tests and isolated containers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the review source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run synthetic tests without provider credentials
        run: pnpm --filter @workspace/launch-updates test
      - name: Build the verified marketing runtime
        run: pnpm --filter @workspace/launch-updates build
      - name: Build and verify the disabled marketing runtime image
        run: |
          docker build --pull --file lib/launch-updates/Dockerfile.marketing --tag samra-marketing:review .
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint node samra-marketing:review -e 'if(process.getuid()===0)process.exit(1)'
          if timeout 20s docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges samra-marketing:review; then
            echo "Marketing runtime unexpectedly enabled without configuration"
            exit 1
          fi
      - name: Build a local-only review image from the allowlisted context
        run: docker build --pull --network=none --tag samra-resend-test:review lib/launch-updates
      - name: Build the public waitlist review image from the allowlisted context
        run: >-
          docker build --pull --network=none
          --file lib/launch-updates/Dockerfile.waitlist
          --tag samra-public-waitlist:review lib/launch-updates
      - name: Verify the image runs as a non-root user
        run: >-
          timeout 20s docker run --rm --network=none --read-only
          --cap-drop=ALL --security-opt=no-new-privileges
          --pids-limit=64 --memory=128m --cpus=1
          --entrypoint node samra-resend-test:review
          -e 'const ids = [process.getuid(), process.geteuid()]; if (ids.some(id => !Number.isInteger(id) || id <= 0)) process.exit(1); console.log("Non-root runtime verified.");'
      - name: Verify the container defaults to disabled without network access
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s docker run --rm --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=128m --cpus=1 \
            samra-resend-test:review |
            node --input-type=module -e '
              import assert from "node:assert/strict";
              let report = "";
              for await (const chunk of process.stdin) report += chunk;
              assert.deepEqual(JSON.parse(report), {
                event: "samra_resend_connection_test", status: "disabled"
              });
              console.log("Disabled container verified; no provider request.");
            '
      - name: Verify the public container is non-root and fails closed without configuration
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s docker run --rm --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=128m --cpus=1 \
            --entrypoint node samra-public-waitlist:review \
            -e 'const ids = [process.getuid(), process.geteuid()]; if (ids.some(id => !Number.isInteger(id) || id <= 0)) process.exit(1); console.log("Non-root public runtime verified.");'
          if timeout 20s docker run --rm --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=128m --cpus=1 \
            samra-public-waitlist:review; then
            echo "Public container unexpectedly started without configuration." >&2
            exit 1
          fi
