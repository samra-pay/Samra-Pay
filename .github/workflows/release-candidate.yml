name: Immutable release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA already contained in GitHub main
        required: true

env:
  TEST_ENVIRONMENT: github-ci-postgres

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  runtime-image-security:
    name: Release runtime image security (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api
            dockerfile: api
            image_name: samra-api
          - id: customer-web
            dockerfile: customer-web
            image_name: samra-customer-web
          - id: operations-web
            dockerfile: operations-web
            image_name: samra-operations-web
          - id: design-system
            dockerfile: design-system
            image_name: samra-design-system-preview
          - id: migrations
            dockerfile: migrate
            image_name: samra-migrations
    env:
      SAMRA_SECURITY_IMAGE_TAG: ${{ inputs.candidate_sha }}

    steps:
      - name: Check out the exact candidate for the runtime image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a floating or non-main runtime image candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git show-ref --verify refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main

      - name: Prepare runtime image evidence
        run: mkdir -p artifacts/release-candidate/security/runtime-images

      - name: Build exact-SHA runtime image from pinned inputs
        run: >-
          docker build
          --file "deploy/gcp/Dockerfile.${{ matrix.dockerfile }}"
          --tag "${{ matrix.image_name }}:${SAMRA_SECURITY_IMAGE_TAG}"
          .

      - name: Record content-addressed runtime image identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DOCKERFILE: deploy/gcp/Dockerfile.${{ matrix.dockerfile }}
          EVIDENCE_PATH: artifacts/release-candidate/security/runtime-images/${{ matrix.id }}-identity.json
          IMAGE_REF: ${{ matrix.image_name }}:${{ inputs.candidate_sha }}
        run: >-
          docker image inspect "${IMAGE_REF}" |
          jq --arg candidateSha "${CANDIDATE_SHA}"
          --arg dockerfile "${DOCKERFILE}"
          --arg imageReference "${IMAGE_REF}"
          '.[0] | {
            schemaVersion: 1,
            candidateSha: $candidateSha,
            dockerfile: $dockerfile,
            imageReference: $imageReference,
            imageId: .Id,
            repositoryDigests: (.RepoDigests // []),
            platform: {os: .Os, architecture: .Architecture}
          }' > "${EVIDENCE_PATH}"

      - name: Gate fixed critical runtime vulnerabilities
        id: image_vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image_name }}:${{ inputs.candidate_sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: artifacts/release-candidate/security/runtime-images/${{ matrix.id }}-vulnerabilities.json
          exit-code: "1"

      - name: Gate high and critical runtime secrets
        id: image_secrets
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image_name }}:${{ inputs.candidate_sha }}
          scanners: secret
          severity: HIGH,CRITICAL
          format: json
          output: artifacts/release-candidate/security/runtime-images/${{ matrix.id }}-secrets.json
          exit-code: "1"
          skip-setup-trivy: true

      - name: Preserve exact-SHA runtime image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-runtime-security-${{ matrix.id }}-${{ inputs.candidate_sha }}
          path: artifacts/release-candidate/security/runtime-images
          if-no-files-found: error
          retention-days: 365

      - name: Enforce runtime image security result
        if: always()
        env:
          SECRETS_OUTCOME: ${{ steps.image_secrets.outcome }}
          VULNERABILITIES_OUTCOME: ${{ steps.image_vulnerabilities.outcome }}
        run: |
          test "${VULNERABILITIES_OUTCOME}" = success
          test "${SECRETS_OUTCOME}" = success

  release-assurance:
    name: Immutable release-candidate evidence
    needs:
      - runtime-image-security
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres-persistence:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_USER: samra_release_persistence
          POSTGRES_PASSWORD: samra_release_persistence
          POSTGRES_DB: samra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samra_release_persistence -d samra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-http:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_USER: samra_release_http
          POSTGRES_PASSWORD: samra_release_http
          POSTGRES_DB: samra_release_http
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U samra_release_http -d samra_release_http"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-resilience:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_USER: samra_release_resilience
          POSTGRES_PASSWORD: samra_release_resilience
          POSTGRES_DB: samra_release_resilience
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U samra_release_resilience -d samra_release_resilience"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-performance:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_USER: samra_release_performance
          POSTGRES_PASSWORD: samra_release_performance
          POSTGRES_DB: samra_release_performance
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U samra_release_performance -d samra_release_performance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-recovery:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_USER: samra_release_recovery
          POSTGRES_PASSWORD: samra_release_recovery
          POSTGRES_DB: samra_release_recovery
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U samra_release_recovery -d samra_release_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEEKLY_CONCURRENCY_ROUNDS: "24"
      WEEKLY_RANDOM_STEPS: "96"
      WEEKLY_RANDOM_SEED: "23063"
      WEEKLY_FAULT_ROUNDS: "8"
      LEDGER_PERF_SMALL_POSTINGS: "100000"
      LEDGER_PERF_LARGE_POSTINGS: "1000000"
      LEDGER_PERF_SAMPLES: "40"
      LEDGER_PERF_RESULTS_PATH: test-results/ledger-performance-characterization.json

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a floating or non-main candidate before execution
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git show-ref --verify refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release evidence directories
        run: mkdir -p artifacts/api-server/test-results artifacts/release-candidate/security

      - name: Download exact-SHA runtime image security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-runtime-security-*-${{ inputs.candidate_sha }}
          path: artifacts/release-candidate/security/runtime-images
          merge-multiple: true

      - name: Record immutable candidate identity
        id: identity
        run: >-
          pnpm --filter @workspace/scripts run release-evidence -- identity
          --candidate-sha "${{ inputs.candidate_sha }}"
          --output artifacts/release-candidate/release-candidate-identity.json

      - name: Run exact-SHA repository source security policy
        id: source_security
        continue-on-error: true
        run: |
          pnpm run test:action-pins
          pnpm run test:repository-controls
          pnpm run test:migration-policy
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env SEMGREP_LOG_FILE=/tmp/semgrep.log \
            --env SEMGREP_VERSION_CACHE_PATH=/tmp/semgrep-version-cache \
            --env SEMGREP_SETTINGS_FILE=/tmp/semgrep-settings.yml \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b \
            semgrep scan --config .semgrep.yml --error --metrics=off --json \
            --output artifacts/release-candidate/security/semgrep.json

      - name: Scan exact-SHA dependencies for fixed critical vulnerabilities
        id: security_vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: artifacts/release-candidate/security/trivy-vulnerabilities.json
          exit-code: "1"

      - name: Scan exact-SHA source for secrets and high-risk configuration
        id: security_secrets
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: artifacts/release-candidate/security/trivy-secrets-misconfiguration.json
          exit-code: "1"
          skip-setup-trivy: true

      - name: Generate exact-SHA CycloneDX software bill of materials
        id: security_sbom
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: artifacts/release-candidate/security/sbom.cdx.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Gate exact-SHA forbidden and restricted dependency licenses
        id: security_licenses
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: HIGH,CRITICAL
          format: json
          output: artifacts/release-candidate/security/trivy-license-policy.json
          exit-code: "1"
          skip-setup-trivy: true

      - name: Aggregate exact-SHA security gate
        id: security
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          LICENSE_RESULT: ${{ steps.security_licenses.outcome }}
          SBOM_RESULT: ${{ steps.security_sbom.outcome }}
          SECRET_RESULT: ${{ steps.security_secrets.outcome }}
          SOURCE_RESULT: ${{ steps.source_security.outcome }}
          RUNTIME_IMAGES_RESULT: ${{ needs.runtime-image-security.result }}
          VULNERABILITY_RESULT: ${{ steps.security_vulnerabilities.outcome }}
        run: |
          test "${SOURCE_RESULT}" = success
          test "${VULNERABILITY_RESULT}" = success
          test "${SECRET_RESULT}" = success
          test "${SBOM_RESULT}" = success
          test "${LICENSE_RESULT}" = success
          test "${RUNTIME_IMAGES_RESULT}" = success

      - name: Run full Linux workspace quality
        id: quality
        continue-on-error: true
        env:
          PORT: "4173"
          BASE_PATH: "/"
          EXPO_PUBLIC_DOMAIN: "ci.invalid"
          EXPO_PUBLIC_SAMRA_ENVIRONMENT: "staging"
          EXPO_PUBLIC_SAMRA_DATA_MODE: "api"
          EXPO_PUBLIC_SAMRA_API_ORIGIN: "https://api.ci.invalid"
          EXPO_PUBLIC_SAMRA_AUTH_MODE: "auth0-native"
          EXPO_PUBLIC_AUTH0_DOMAIN: "auth0.ci.invalid"
          EXPO_PUBLIC_AUTH0_CLIENT_ID: "NativeCiClient_12345678"
          EXPO_PUBLIC_AUTH0_AUDIENCE: "https://api.staging.samrapay.com"
        run: |
          pnpm --filter @workspace/api-spec run codegen:check
          pnpm run test:test-evidence
          pnpm run test:testing-cadence
          pnpm run test:release-contract
          pnpm run typecheck
          pnpm run test
          pnpm run test:gcp-platform
          pnpm -r --filter "!@workspace/samra-pay-commercial" --if-present run build
          pnpm run test:experience-budgets -- --candidate-sha "${{ inputs.candidate_sha }}" --output artifacts/release-candidate/experience-budget-report.json

      - name: Run isolated commercial release build
        id: commercial
        continue-on-error: true
        env:
          PORT: "4173"
          BASE_PATH: "/"
        run: |
          pnpm run commercial:typecheck
          pnpm run commercial:build

      - name: Apply migrations and prove repeatable seed
        id: migrations
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://samra_release_persistence:samra_release_persistence@127.0.0.1:5432/samra_test
        run: |
          pnpm --filter @workspace/db run test:migrate
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/db run test:seed

      - name: Run PostgreSQL persistence and ledger release suite
        id: postgres_persistence
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://samra_release_persistence:samra_release_persistence@127.0.0.1:5432/samra_test
        run: |
          pnpm --filter @workspace/db run test:staging-access:junit
          pnpm --filter @workspace/api-server run test:postgres:junit
          pnpm --filter @workspace/api-server run test:ledger-journals:junit
          pnpm --filter @workspace/api-server run test:ledger-account-resolution:junit
          pnpm --filter @workspace/api-server run test:ledger-currency-precision:junit
          pnpm --filter @workspace/api-server run test:ledger-balances:junit
          pnpm --filter @workspace/api-server run test:ledger-idempotency:junit
          pnpm --filter @workspace/api-server run test:ledger-holds:junit
          pnpm --filter @workspace/api-server run test:ledger-reversals:junit
          pnpm --filter @workspace/api-server run test:ledger-audit:junit
          pnpm --filter @workspace/api-server run test:ledger-concurrency:junit
          pnpm --filter @workspace/api-server run test:ledger-materialized:junit
          pnpm --filter @workspace/api-server run test:ledger-sweeps:junit
          pnpm --filter @workspace/api-server run test:ledger-reconciliation:junit

      - name: Run HTTP, daily journey, and process-restart release suite
        id: postgres_http
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://samra_release_http:samra_release_http@127.0.0.1:5433/samra_release_http
        run: |
          pnpm --filter @workspace/db run test:migrate
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/api-server run build
          pnpm --filter @workspace/api-server run test:postgres-http:junit
          pnpm --filter @workspace/api-server run test:daily-synthetic:junit
          pnpm --filter @workspace/api-server run test:process-restart:junit

      - name: Run weekly backend resilience release suite
        id: resilience
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://samra_release_resilience:samra_release_resilience@127.0.0.1:5434/samra_release_resilience
        run: |
          pnpm --filter @workspace/db run test:migrate
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/api-server run test:weekly-concurrency:junit
          pnpm --filter @workspace/api-server run test:weekly-randomized:junit
          pnpm --filter @workspace/api-server run test:weekly-faults:junit
          pnpm --filter @workspace/api-server run test:weekly-migrations:junit

      - name: Run synthetic logical backup and restore release rehearsal
        id: recovery
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://samra_release_recovery:samra_release_recovery@127.0.0.1:5436/samra_release_recovery
          SAMRA_DISPOSABLE_BACKUP_RESTORE_CONFIRMATION: I_UNDERSTAND_THIS_DROPS_DISPOSABLE_LOCAL_DATABASES
          SAMRA_RECOVERY_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SAMRA_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          WEEKLY_BACKUP_RESTORE_RESULTS_PATH: test-results/weekly-backup-restore.json
        run: |
          pnpm --filter @workspace/db run test:migrate
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/api-server run test:weekly-backup-restore:junit

      - name: Run million-posting materialized balance gate
        id: performance
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://samra_release_performance:samra_release_performance@127.0.0.1:5435/samra_release_performance
        run: |
          pnpm --filter @workspace/db run test:migrate
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/api-server run test:ledger-performance:junit

      - name: Build stable Qase release gate payload
        id: qase_payload
        if: ${{ !cancelled() }}
        env:
          RELEASE_GATE_RESULTS: >-
            {"identity":"${{ steps.identity.outcome }}","security":"${{ steps.security.outcome }}","quality":"${{ steps.quality.outcome }}","commercial":"${{ steps.commercial.outcome }}","migrations":"${{ steps.migrations.outcome }}","postgres_persistence":"${{ steps.postgres_persistence.outcome }}","postgres_http":"${{ steps.postgres_http.outcome }}","resilience":"${{ steps.resilience.outcome }}","recovery":"${{ steps.recovery.outcome }}","performance":"${{ steps.performance.outcome }}"}
        run: >-
          pnpm --filter @workspace/scripts run release-evidence -- gate-junit
          --identity artifacts/release-candidate/release-candidate-identity.json
          --output artifacts/release-candidate/release-gates.xml

      - name: Record Qase release identity
        if: always()
        env:
          QASE_REPORTING_ENABLED: "false"
          QASE_RUN_ID: ""
          QASE_REPORTING_RESULTS: >-
            {"qase_create":"skipped","qase_upload":"skipped","qase_complete":"skipped"}
        run: >-
          pnpm --filter @workspace/scripts run release-evidence -- qase-metadata
          --output artifacts/release-candidate/qase-run.json

      - name: Build content-addressed release evidence manifest
        if: always()
        env:
          RELEASE_GATE_RESULTS: >-
            {"identity":"${{ steps.identity.outcome }}","security":"${{ steps.security.outcome }}","quality":"${{ steps.quality.outcome }}","commercial":"${{ steps.commercial.outcome }}","migrations":"${{ steps.migrations.outcome }}","postgres_persistence":"${{ steps.postgres_persistence.outcome }}","postgres_http":"${{ steps.postgres_http.outcome }}","resilience":"${{ steps.resilience.outcome }}","recovery":"${{ steps.recovery.outcome }}","performance":"${{ steps.performance.outcome }}"}
        run: >-
          pnpm --filter @workspace/scripts run release-evidence -- manifest
          --identity artifacts/release-candidate/release-candidate-identity.json
          --qase artifacts/release-candidate/qase-run.json

      - name: Preserve immutable release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: samra-${{ steps.identity.outputs.release_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/release-candidate-identity.json
            artifacts/release-candidate/release-gates.xml
            artifacts/release-candidate/qase-run.json
            artifacts/release-candidate/release-evidence-manifest.json
            artifacts/release-candidate/release-evidence-manifest.sha256
            artifacts/release-candidate/experience-budget-report.json
            artifacts/release-candidate/security/semgrep.json
            artifacts/release-candidate/security/trivy-vulnerabilities.json
            artifacts/release-candidate/security/trivy-secrets-misconfiguration.json
            artifacts/release-candidate/security/trivy-license-policy.json
            artifacts/release-candidate/security/sbom.cdx.json
            artifacts/release-candidate/security/runtime-images/api-identity.json
            artifacts/release-candidate/security/runtime-images/api-vulnerabilities.json
            artifacts/release-candidate/security/runtime-images/api-secrets.json
            artifacts/release-candidate/security/runtime-images/customer-web-identity.json
            artifacts/release-candidate/security/runtime-images/customer-web-vulnerabilities.json
            artifacts/release-candidate/security/runtime-images/customer-web-secrets.json
            artifacts/release-candidate/security/runtime-images/operations-web-identity.json
            artifacts/release-candidate/security/runtime-images/operations-web-vulnerabilities.json
            artifacts/release-candidate/security/runtime-images/operations-web-secrets.json
            artifacts/release-candidate/security/runtime-images/design-system-identity.json
            artifacts/release-candidate/security/runtime-images/design-system-vulnerabilities.json
            artifacts/release-candidate/security/runtime-images/design-system-secrets.json
            artifacts/release-candidate/security/runtime-images/migrations-identity.json
            artifacts/release-candidate/security/runtime-images/migrations-vulnerabilities.json
            artifacts/release-candidate/security/runtime-images/migrations-secrets.json
            artifacts/api-server/test-results/postgres-persistence.xml
            artifacts/api-server/test-results/staging-database-access.xml
            artifacts/api-server/test-results/postgres-http.xml
            artifacts/api-server/test-results/daily-synthetic-journeys.xml
            artifacts/api-server/test-results/postgres-process-restart.xml
            artifacts/api-server/test-results/ledger-journal-assurance.xml
            artifacts/api-server/test-results/ledger-account-resolution.xml
            artifacts/api-server/test-results/ledger-currency-precision.xml
            artifacts/api-server/test-results/ledger-balance-computation.xml
            artifacts/api-server/test-results/ledger-idempotency.xml
