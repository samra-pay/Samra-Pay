name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contracts
        run: pnpm --filter @workspace/api-spec run codegen:check

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Run workspace tests
        run: pnpm run test

      - name: Build production artifacts
        run: pnpm -r --if-present run build
        env:
          PORT: "4173"
          BASE_PATH: "/"
          EXPO_PUBLIC_DOMAIN: "ci.invalid"

  postgres-persistence:
    name: PostgreSQL persistence gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: samra_test
          POSTGRES_PASSWORD: samra_test
          POSTGRES_DB: samra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samra_test -d samra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://samra_test:samra_test@127.0.0.1:5432/samra_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply explicit test migrations
        run: pnpm --filter @workspace/db run test:migrate

      - name: Prove seed idempotency
        run: |
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/db run test:seed

      - name: Run PostgreSQL acceptance tests
        run: pnpm --filter @workspace/api-server run test:postgres

  postgres-http:
    name: PostgreSQL HTTP acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: samra_http_test
          POSTGRES_PASSWORD: samra_http_test
          POSTGRES_DB: samra_http_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samra_http_test -d samra_http_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://samra_http_test:samra_http_test@127.0.0.1:5432/samra_http_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply explicit test migrations
        run: pnpm --filter @workspace/db run test:migrate

      - name: Seed synthetic test accounts
        run: pnpm --filter @workspace/db run test:seed

      - name: Run HTTP-to-PostgreSQL acceptance test
        run: pnpm --filter @workspace/api-server run test:postgres-http
