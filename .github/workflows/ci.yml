name: CI

on:
  workflow_dispatch:
    inputs:
      qase_api_base_url:
        description: Qase API URL
        required: false
        default: https://api.qase.io
      qase_report:
        description: Report automated acceptance results to Qase
        required: false
        default: "true"
      qase_project_code:
        description: Qase project code
        required: false
        default: SAMP
      qase_environment:
        description: Qase environment slug
        required: false
        default: github-ci-postgres
      qase_run_id:
        description: Existing Qase automated run ID
        required: false
      qase_run_complete:
        description: Complete the Qase run after reporting
        required: false
        default: "true"
      run_commercial:
        description: Run the isolated commercial typecheck and build
        required: false
        default: "true"
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contracts
        run: pnpm --filter @workspace/api-spec run codegen:check

      - name: Validate Qase governance contract
        run: pnpm run test:qase-contract

      - name: Validate testing cadence contract
        run: pnpm run test:testing-cadence

      - name: Validate immutable release-candidate contract
        run: pnpm run test:release-contract

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Run workspace tests
        run: pnpm run test

      - name: Validate Google Cloud portability contracts
        run: pnpm run test:gcp-platform

      - name: Build production artifacts
        run: pnpm -r --filter "!@workspace/samra-pay-commercial" --if-present run build
        env:
          PORT: "4173"
          BASE_PATH: "/"
          EXPO_PUBLIC_DOMAIN: "ci.invalid"
          EXPO_PUBLIC_SAMRA_DATA_MODE: "api"
          EXPO_PUBLIC_SAMRA_API_ORIGIN: "https://api.ci.invalid"

      - name: Enforce customer experience artifact budgets
        run: >-
          pnpm run test:experience-budgets --
          --candidate-sha "${GITHUB_SHA}"
          --output tmp/experience-budget-report.json

      - name: Preserve customer experience budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-experience-budgets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: tmp/experience-budget-report.json
          if-no-files-found: error
          retention-days: 30

  commercial-daily:
    name: Daily commercial isolation gate
    if: github.event_name == 'schedule' || inputs.run_commercial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck isolated commercial package
        run: pnpm run commercial:typecheck

      - name: Build isolated commercial package
        run: pnpm run commercial:build
        env:
          PORT: "4173"
          BASE_PATH: "/"

  postgres-persistence:
    name: PostgreSQL persistence gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: samra_test
          POSTGRES_PASSWORD: samra_test
          POSTGRES_DB: samra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samra_test -d samra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://samra_test:samra_test@127.0.0.1:5432/samra_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply explicit test migrations
        run: pnpm --filter @workspace/db run test:migrate

      - name: Prove seed idempotency
        run: |
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/db run test:seed

      - name: Prepare JUnit results directory
        run: mkdir -p artifacts/api-server/test-results

      - name: Run PostgreSQL acceptance tests
        run: pnpm --filter @workspace/api-server run test:postgres:junit

      - name: Run ledger journal assurance tests
        run: pnpm --filter @workspace/api-server run test:ledger-journals:junit

      - name: Run ledger account resolution tests
        run: pnpm --filter @workspace/api-server run test:ledger-account-resolution:junit

      - name: Run ledger currency and precision tests
        run: pnpm --filter @workspace/api-server run test:ledger-currency-precision:junit

      - name: Run ledger balance computation tests
        run: pnpm --filter @workspace/api-server run test:ledger-balances:junit

      - name: Run ledger idempotency tests
        run: pnpm --filter @workspace/api-server run test:ledger-idempotency:junit

      - name: Run ledger hold lifecycle tests
        run: pnpm --filter @workspace/api-server run test:ledger-holds:junit

      - name: Run ledger reversal and refund tests
        run: pnpm --filter @workspace/api-server run test:ledger-reversals:junit

      - name: Run ledger immutability and audit tests
        run: pnpm --filter @workspace/api-server run test:ledger-audit:junit

      - name: Run ledger concurrency and atomicity tests
        run: pnpm --filter @workspace/api-server run test:ledger-concurrency:junit

      - name: Run materialized ledger balance tests
        run: pnpm --filter @workspace/api-server run test:ledger-materialized:junit

      - name: Run global ledger invariant sweeps
        run: pnpm --filter @workspace/api-server run test:ledger-sweeps:junit

      - name: Run reconciliation resolution control tests
        run: pnpm --filter @workspace/api-server run test:ledger-reconciliation:junit

      - name: Preserve PostgreSQL acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-persistence-junit
          path: |
            artifacts/api-server/test-results/postgres-persistence.xml
            artifacts/api-server/test-results/ledger-journal-assurance.xml
            artifacts/api-server/test-results/ledger-account-resolution.xml
            artifacts/api-server/test-results/ledger-currency-precision.xml
            artifacts/api-server/test-results/ledger-balance-computation.xml
            artifacts/api-server/test-results/ledger-idempotency.xml
            artifacts/api-server/test-results/ledger-holds-lifecycle.xml
            artifacts/api-server/test-results/ledger-reversals-refunds.xml
            artifacts/api-server/test-results/ledger-immutability-audit.xml
            artifacts/api-server/test-results/ledger-concurrency-atomicity.xml
            artifacts/api-server/test-results/ledger-materialized-balances.xml
            artifacts/api-server/test-results/ledger-sweeps.xml
            artifacts/api-server/test-results/ledger-reconciliation-controls.xml
          if-no-files-found: error
          retention-days: 14

  postgres-http:
    name: PostgreSQL HTTP acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: samra_http_test
          POSTGRES_PASSWORD: samra_http_test
          POSTGRES_DB: samra_http_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samra_http_test -d samra_http_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://samra_http_test:samra_http_test@127.0.0.1:5432/samra_http_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply explicit test migrations
        run: pnpm --filter @workspace/db run test:migrate

      - name: Seed synthetic test accounts
        run: pnpm --filter @workspace/db run test:seed

      - name: Build compiled API process
        run: pnpm --filter @workspace/api-server run build

      - name: Prepare JUnit results directory
        run: mkdir -p artifacts/api-server/test-results

      - name: Run HTTP-to-PostgreSQL acceptance test
        run: pnpm --filter @workspace/api-server run test:postgres-http:junit

      - name: Run daily synthetic PostgreSQL journeys
        run: pnpm --filter @workspace/api-server run test:daily-synthetic:junit

      - name: Run compiled process startup and restart test
        run: pnpm --filter @workspace/api-server run test:process-restart:junit

      - name: Preserve HTTP-to-PostgreSQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-http-junit
          path: |
            artifacts/api-server/test-results/postgres-http.xml
            artifacts/api-server/test-results/daily-synthetic-journeys.xml
            artifacts/api-server/test-results/postgres-process-restart.xml
          if-no-files-found: error
          retention-days: 14

  qase-report:
    name: Qase automated acceptance report
    needs:
      - postgres-persistence
      - postgres-http
    if: >-
      always() &&
      inputs.qase_report != 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QASE_API_BASE_URL: ${{ inputs.qase_api_base_url || 'https://api.qase.io' }}
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
      QASE_TESTOPS_PROJECT: ${{ inputs.qase_project_code || 'SAMP' }}
      QASE_TESTOPS_ENVIRONMENT: ${{ inputs.qase_environment || 'github-ci-postgres' }}
      QASE_TESTOPS_RUN_ID: ${{ inputs.qase_run_id }}
      QASE_TESTOPS_RUN_COMPLETE: ${{ inputs.qase_run_complete || 'true' }}
      QASE_RUN_SOURCE: "${{ github.event_name == 'pull_request' && format('PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || github.ref_name }}"

    steps:
      - name: Link a Qase-triggered workflow run
        if: inputs.qase_run_id != ''
        uses: cskmnrpt/qase-link-run@v2

      - name: Download acceptance results
        uses: actions/download-artifact@v4
        with:
          pattern: "*-junit"
          path: test-results
          merge-multiple: true

      - name: Validate Qase JUnit payloads
        run: |
          for report in \
            test-results/postgres-persistence.xml \
            test-results/ledger-journal-assurance.xml \
            test-results/ledger-account-resolution.xml \
            test-results/ledger-currency-precision.xml \
            test-results/ledger-balance-computation.xml \
            test-results/ledger-idempotency.xml \
            test-results/ledger-holds-lifecycle.xml \
            test-results/ledger-reversals-refunds.xml \
            test-results/ledger-immutability-audit.xml \
            test-results/ledger-concurrency-atomicity.xml \
            test-results/ledger-materialized-balances.xml \
            test-results/ledger-sweeps.xml \
            test-results/ledger-reconciliation-controls.xml \
            test-results/postgres-http.xml \
            test-results/daily-synthetic-journeys.xml \
            test-results/postgres-process-restart.xml
          do
            test -s "$report"
            grep -q '<testsuite ' "$report"
            grep -q '<testcase ' "$report"
          done

      - name: Create Qase run for GitHub-triggered CI
        id: qase-run-create
        if: inputs.qase_run_id == ''
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: qase-tms/gh-actions/run-create@v1
        with:
          project: ${{ env.QASE_TESTOPS_PROJECT }}
          environment: ${{ env.QASE_TESTOPS_ENVIRONMENT }}
          title: ${{ github.event_name == 'schedule' && 'Samra Pay daily backend acceptance' || 'Samra Pay automated backend acceptance' }} — ${{ env.QASE_RUN_SOURCE }} @ ${{ github.sha }}
          description: PostgreSQL durability and HTTP-to-ledger acceptance from ${{ github.event_name }} GitHub Actions.

      - name: Resolve Qase run
        id: qase-run
        env:
          INPUT_RUN_ID: ${{ inputs.qase_run_id }}
          CREATED_RUN_ID: ${{ steps.qase-run-create.outputs.id }}
        run: |
          run_id="${INPUT_RUN_ID:-$CREATED_RUN_ID}"
          if [ -n "$run_id" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "id=$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Qase reporting skipped because no run ID was available."
          fi

      - name: Upload automated acceptance results to Qase
        id: qase-upload-acceptance
        if: steps.qase-run.outputs.available == 'true'
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: qase-tms/gh-actions/report@v1
        with:
          project: ${{ env.QASE_TESTOPS_PROJECT }}
          id: ${{ steps.qase-run.outputs.id }}
          format: junit
          path: test-results

      - name: Complete Qase run
        if: >-
          always() &&
          steps.qase-run.outputs.available == 'true' &&
          steps.qase-upload-acceptance.outcome == 'success' &&
          (inputs.qase_run_id == '' || inputs.qase_run_complete != 'false')
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: qase-tms/gh-actions/run-complete@v1
        with:
          project: ${{ env.QASE_TESTOPS_PROJECT }}
          id: ${{ steps.qase-run.outputs.id }}
