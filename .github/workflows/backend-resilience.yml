name: Weekly backend resilience

on:
  workflow_dispatch:
    inputs:
      concurrency_rounds:
        description: Concurrent reserve and terminal-race rounds
        required: false
        default: "24"
      randomized_steps:
        description: Deterministic model-based ledger steps
        required: false
        default: "96"
      randomized_seed:
        description: Reproducible unsigned 32-bit sequence seed
        required: false
        default: "23063"
      fault_rounds:
        description: Controlled rollback and connection-fault rounds
        required: false
        default: "8"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/backend-resilience.yml"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/test/weekly-*.ts"
      - "docs/operations/**"
      - "package.json"
      - "scripts/package.json"
      - "scripts/src/validate-operational-readiness.*"
      - "lib/db/package.json"
      - "lib/db/drizzle.config.ts"
      - "lib/db/drizzle/**"
      - "lib/db/src/schema/**"
      - "lib/db/src/test-migrate.ts"
      - "lib/db/src/test-seed.ts"
  schedule:
    - cron: "43 7 * * 6"

permissions:
  contents: read

concurrency:
  group: backend-resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    name: PostgreSQL weekly backend resilience gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_USER: samra_resilience
          POSTGRES_PASSWORD: samra_resilience
          POSTGRES_DB: samra_resilience
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samra_resilience -d samra_resilience"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://samra_resilience:samra_resilience@127.0.0.1:5432/samra_resilience
      WEEKLY_CONCURRENCY_ROUNDS: ${{ inputs.concurrency_rounds || '24' }}
      WEEKLY_RANDOM_STEPS: ${{ inputs.randomized_steps || '96' }}
      WEEKLY_RANDOM_SEED: ${{ inputs.randomized_seed || '23063' }}
      WEEKLY_FAULT_ROUNDS: ${{ inputs.fault_rounds || '8' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply current migrations
        run: pnpm --filter @workspace/db run test:migrate

      - name: Seed synthetic accounts twice
        run: |
          pnpm --filter @workspace/db run test:seed
          pnpm --filter @workspace/db run test:seed

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/test-results

      - name: Run bounded concurrency soak
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/api-server run test:weekly-concurrency:junit

      - name: Run seeded randomized ledger model
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/api-server run test:weekly-randomized:junit

      - name: Run controlled fault injection
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/api-server run test:weekly-faults:junit

      - name: Run prior-schema migration compatibility
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/api-server run test:weekly-migrations:junit

      - name: Run synthetic backup and restore rehearsal
        if: ${{ !cancelled() }}
        env:
          SAMRA_DISPOSABLE_BACKUP_RESTORE_CONFIRMATION: I_UNDERSTAND_THIS_DROPS_DISPOSABLE_LOCAL_DATABASES
          SAMRA_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          SAMRA_RECOVERY_CANDIDATE_SHA: ${{ github.sha }}
          WEEKLY_BACKUP_RESTORE_RESULTS_PATH: test-results/weekly-backup-restore.json
        run: pnpm --filter @workspace/api-server run test:weekly-backup-restore:junit

      - name: Preserve weekly resilience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-backend-resilience-junit
          path: |
            artifacts/api-server/test-results/weekly-concurrency-soak.xml
            artifacts/api-server/test-results/weekly-randomized-ledger.xml
            artifacts/api-server/test-results/weekly-fault-injection.xml
            artifacts/api-server/test-results/weekly-migration-compatibility.xml
            artifacts/api-server/test-results/weekly-backup-restore.xml
          if-no-files-found: error
          retention-days: 90

      - name: Preserve synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-backend-recovery-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/api-server/test-results/weekly-backup-restore.json
          if-no-files-found: error
          retention-days: 90

  qase-report:
    name: Qase weekly backend resilience report
    needs: resilience
    if: >-
      always() &&
      needs.resilience.result != 'cancelled' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QASE_TESTOPS_PROJECT: SAMP
      QASE_TESTOPS_ENVIRONMENT: github-ci-postgres

    steps:
      - name: Download weekly resilience evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-backend-resilience-junit
          path: test-results

      - name: Validate weekly resilience JUnit payloads
        run: |
          for report in \
            test-results/weekly-concurrency-soak.xml \
            test-results/weekly-randomized-ledger.xml \
            test-results/weekly-fault-injection.xml \
            test-results/weekly-migration-compatibility.xml \
            test-results/weekly-backup-restore.xml
          do
            test -s "$report"
            grep -q '<testsuite ' "$report"
            grep -q '<testcase ' "$report"
          done

      - name: Create Qase weekly resilience run
        id: qase-run-create
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: qase-tms/gh-actions/run-create@e4f92808975e11c5b9c8a26701726076d942ca9b # v1.2
        with:
          token: ${{ secrets.QASE_API_TOKEN }}
          project: ${{ env.QASE_TESTOPS_PROJECT }}
          environment: ${{ env.QASE_TESTOPS_ENVIRONMENT }}
          title: Samra Pay weekly backend resilience — ${{ github.ref_name }} @ ${{ github.sha }}
          description: Bounded concurrency soak, seeded ledger model, controlled fault injection, migration compatibility, and synthetic logical backup/restore against disposable PostgreSQL 16.

      - name: Upload weekly resilience results to Qase
        id: qase-upload-resilience
        if: steps.qase-run-create.outputs.id != ''
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: qase-tms/gh-actions/report@e4f92808975e11c5b9c8a26701726076d942ca9b # v1.2
        with:
          token: ${{ secrets.QASE_API_TOKEN }}
          project: ${{ env.QASE_TESTOPS_PROJECT }}
          id: ${{ steps.qase-run-create.outputs.id }}
          format: junit
          path: test-results

      - name: Complete Qase weekly resilience run
        if: >-
          always() &&
          steps.qase-run-create.outputs.id != '' &&
          steps.qase-upload-resilience.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: qase-tms/gh-actions/run-complete@e4f92808975e11c5b9c8a26701726076d942ca9b # v1.2
        with:
          token: ${{ secrets.QASE_API_TOKEN }}
          project: ${{ env.QASE_TESTOPS_PROJECT }}
          id: ${{ steps.qase-run-create.outputs.id }}
