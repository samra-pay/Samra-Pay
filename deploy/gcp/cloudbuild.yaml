substitutions:
  _BUILD_SERVICE_ACCOUNT: unset
  _ENVIRONMENT: unset
  _IMAGE_TAG: unset
  _REGION: unset
  _REPOSITORY: unset

steps:
  - id: validate-build-inputs
    name: node:24-bookworm-slim
    entrypoint: node
    args:
      - deploy/gcp/validate-build-inputs.mjs
    env:
      - SAMRA_BUILD_ENVIRONMENT=${_ENVIRONMENT}
      - SAMRA_BUILD_EXPECTED_SERVICE_ACCOUNT=${_BUILD_SERVICE_ACCOUNT}
      - SAMRA_BUILD_IMAGE_TAG=${_IMAGE_TAG}
      - SAMRA_BUILD_PROJECT_ID=$PROJECT_ID
      - SAMRA_BUILD_REGION=${_REGION}
      - SAMRA_BUILD_REPOSITORY=${_REPOSITORY}
      - SAMRA_BUILD_SOURCE_SHA=$COMMIT_SHA

  - id: platform-contract-tests
    name: node:24-bookworm-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        pnpm install --frozen-lockfile
        node artifacts/samra-pay-ds/scripts/check-source-boundary.mjs
        pnpm run test:gcp-platform
        pnpm run typecheck

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/gcp/Dockerfile.api
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-api:${_IMAGE_TAG}
      - .

  - id: build-customer-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/gcp/Dockerfile.customer-web
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-customer-web:${_IMAGE_TAG}
      - .

  - id: build-operations-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/gcp/Dockerfile.operations-web
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-operations-web:${_IMAGE_TAG}
      - .

  - id: build-design-system
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/gcp/Dockerfile.design-system
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-design-system-preview:${_IMAGE_TAG}
      - .

  - id: build-migrations
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/gcp/Dockerfile.migrate
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-migrations:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-api:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-customer-web:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-operations-web:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-design-system-preview:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/samra-migrations:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

serviceAccount: projects/$PROJECT_ID/serviceAccounts/${_BUILD_SERVICE_ACCOUNT}

timeout: 2400s
