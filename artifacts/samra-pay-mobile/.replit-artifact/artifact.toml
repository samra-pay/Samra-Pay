kind = "mobile"
previewPath = "/mobile/"
title = "Samra Pay Mobile"
description = "A mobile companion app for Samra Pay members, mirroring the Midnight Gold web experience: dummy login, dashboard overview with balances and recent transactions, cards with Mastercard/Ethiopian Airlines co-brand art, and a remittance calculator at the 180 ETB promo rate. Uses the same illustrative demo data as the web dashboard."
version = "1.0.0"
id = "artifacts/samra-pay-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21314

[services.development]
run = "pnpm --filter @workspace/samra-pay-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/samra-pay-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/samra-pay-mobile", "run", "serve" ]

[services.env]
PORT = "21314"
BASE_PATH = "/mobile/"
